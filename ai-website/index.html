<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本コンサルタントグループ　採用サイト</title>
  <link rel="stylesheet" href="css/style3.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <div class="site-logo">日本コンサルタントグループ</div>
      <nav class="global-nav">
        <ul class="nav-list">
          <li class="nav-item"><a href="#about" class="nav-link">会社概要</a></li>
          <li class="nav-item"><a href="#business" class="nav-link">事業内容</a></li>
          <li class="nav-item"><a href="#recruit" class="nav-link">採用情報</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="site-main">
    <section class="slideshow-section">
      <div class="slideshow-wrapper">
        <img
          id="slideshow-image"
          class="slideshow-img"
          src="images/image1.png"
          alt="スライドショー画像"
        >
      </div>
    </section>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <p class="footer-copy">
      &copy;<span id="current-year"></span> nippon consaltant group,inc. All rights reserved.
    </p>
  </footer>

  <script src="js/script.js"></script>

</html>
